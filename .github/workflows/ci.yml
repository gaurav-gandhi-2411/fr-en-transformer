name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Run both interpreters to completion: a 3.13 failure must not hide a 3.12 result.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # ---- 3.12: the locked uv environment (what the ablations and the local env use) -------
      - name: Install uv
        if: matrix.python-version == '3.12'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python 3.12
        if: matrix.python-version == '3.12'
        run: uv python install 3.12

      - name: Check uv.lock is up to date
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Sync dependencies (frozen)
        if: matrix.python-version == '3.12'
        run: uv sync --frozen --python 3.12

      - name: Lint (ruff check)
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Format check (ruff format)
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .

      - name: Test (pytest)
        if: matrix.python-version == '3.12'
        run: uv run pytest -q

      # The scorer-encoding tests guard the Windows/UTF-8 scoring path; a silent skip would hide a
      # regression, so show every test as PASSED/FAILED in the log and fail on any SKIPPED line.
      - name: Scorer-encoding tests, verbose (must run, not skip)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -eo pipefail
          uv run pytest tests/test_scorer_encoding.py tests/test_official_scorer.py -v -rs \
            | tee "$RUNNER_TEMP/scorer_encoding.log"
          if grep -q " SKIPPED" "$RUNNER_TEMP/scorer_encoding.log"; then
            echo "scorer-encoding tests were SKIPPED; they must run" >&2
            exit 1
          fi

      # ---- 3.13: Colab's interpreter, reproduced the way the Colab notebook installs ---------
      # Plain pip in a venv (no uv): preinstalled torch + `requirements-colab.txt` under a torch
      # constraint + `pip install -e . --no-deps`, i.e. the exact sequence of the notebook's
      # install cell, then the full test suite and the notebook itself.
      - name: Set up Python 3.13
        if: matrix.python-version == '3.13'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install the Colab-style environment
        if: matrix.python-version == '3.13'
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --disable-pip-version-check pip==26.2.1
          # Stand-in for Colab's preinstalled torch: the CPU wheel of the version pinned in
          # pyproject.toml (the same version uv.lock resolves for CPU/CI).
          TORCH_VERSION=$(sed -n 's/^ *"torch==\([0-9.]*\)",$/\1/p' pyproject.toml)
          test -n "$TORCH_VERSION"
          "$PY" -m pip install --disable-pip-version-check "torch==${TORCH_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu
          # Same helper as the notebook's install cell, so the two cannot drift.
          "$PY" colab/make_torch_constraints.py "$RUNNER_TEMP/torch_constraints.txt"
          "$PY" -m pip install --disable-pip-version-check \
            -r requirements-colab.txt -c "$RUNNER_TEMP/torch_constraints.txt"
          "$PY" -m pip install --disable-pip-version-check -e . --no-deps
          # Test + notebook-execution tooling, pinned to the versions in the uv dev group.
          "$PY" -m pip install --disable-pip-version-check \
            pytest==9.1.1 nbclient==0.11.0 nbformat==5.11.1 ipykernel==7.4.0
          # pip must not have swapped the preinstalled torch.
          "$PY" -c "import torch; print('torch', torch.__version__)"
          grep -qx "torch==$("$PY" -c 'import torch; print(torch.__version__)')" \
            "$RUNNER_TEMP/torch_constraints.txt"
          "$PY" -m pip check

      - name: Test (pytest, Python 3.13)
        if: matrix.python-version == '3.13'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q

      # The real shards are gitignored (145 MB, private HF dataset), so CI builds tiny SYNTHETIC
      # copy-task shards + manifest: this proves every notebook cell and the training subprocess
      # execute on 3.13; it says nothing about model quality (colab/make_synthetic_shards.py).
      - name: Execute colab/train.ipynb in smoke mode (synthetic shards, Python 3.13)
        if: matrix.python-version == '3.13'
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" colab/make_synthetic_shards.py .
          # The notebook's defaults are the real L4 main run; say "smoke" explicitly here.
          "$PY" colab/execute_notebook.py colab/train.ipynb 1800 \
            --set CONFIG='"smoke"' --set PLANNED_STEPS=None --set RESUME_TEST=False

      # CONFIG="ablations_l4" (s1 -> s2 -> s3 in one Colab session) executed end to end as a DRY
      # RUN: every cell runs on the synthetic shards built by the smoke step above, the per-config
      # plan (dirs, skip/resume/fresh decision, exact argv) is printed, and NOTHING is trained.
      # execute_notebook.py refuses this config without DRY_RUN=True. PLANNED_STEPS is left at its
      # default on purpose: it must be ignored (loudly) in this mode.
      - name: Execute colab/train.ipynb in ablations_l4 DRY_RUN mode (synthetic shards, 3.13)
        if: matrix.python-version == '3.13'
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" colab/execute_notebook.py colab/train.ipynb 1800 \
            --set CONFIG='"ablations_l4"' --set DRY_RUN=True

      # CONFIG="eval_l4" + RUN="all" (main, then s1/s2/s3; each: benchmark -> candidates -> tuning ->
      # selection -> decodes -> private HF
      # upload, one Colab session) executed end to end as a DRY RUN: the plan, the per-candidate
      # checkpoint files (all MISSING on this host, reported not fatal in a dry run), and the
      # runtime ESTIMATE are printed; nothing is decoded, downloaded or uploaded.
      # execute_notebook.py refuses this config without DRY_RUN=True.
      - name: Execute colab/train.ipynb in eval_l4 RUN=all DRY_RUN mode (Python 3.13)
        if: matrix.python-version == '3.13'
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" colab/execute_notebook.py colab/train.ipynb 1800 \
            --set CONFIG='"eval_l4"' --set DRY_RUN=True --set RUN='"all"'

      # CONFIG="extend_l4" (PREREG rule 4: stable 19k -> 40k, Branch A, Branch B in one Colab
      # session) executed end to end as a DRY RUN: the input-checkpoint check (MISSING on this
      # host, reported not fatal in a dry run), each run's plan and exact argv (--init-from only on
      # a fresh run) and the labelled ESTIMATE are printed; nothing is trained.
      # execute_notebook.py refuses this config without DRY_RUN=True.
      - name: Execute colab/train.ipynb in extend_l4 DRY_RUN mode (synthetic shards, 3.13)
        if: matrix.python-version == '3.13'
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" colab/execute_notebook.py colab/train.ipynb 1800 \
            --set CONFIG='"extend_l4"' --set DRY_RUN=True
