[project]
name = "fr-en-transformer-cuda"
version = "0.1.0"
description = "CUDA runtime env for fr-en-transformer on the local RTX 3070 (see README.md). Same pins as the root uv.lock; torch from the CUDA wheel index."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.33.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyyaml==6.0.3",
    "sacrebleu==2.6.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "statsmodels==0.15.0",
    "tqdm==4.70.1",
    "wandb==0.30.0",
    # Same version as the root pyproject; only the local tag differs (+cu130 vs +cpu).
    "torch==2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
# Virtual project: the repo's own `nmt` package is NOT installed into this env. Code is run from
# the repo root (`python -m ...` puts the cwd on sys.path), see README.md.
package = false
# Every transitive package the root uv.lock resolved, pinned to the identical version, so this env
# cannot drift from the CPU/CI env by a transitive bump. tests/test_cuda_env_pins.py enforces it.
constraint-dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
