[project]
name = "comet-eval"
version = "0.1.0"
description = "Isolated COMET-22 scorer env (spec §8): unbabel-comet pins numpy<2 / old torchmetrics and does not co-resolve with the main repo's torch==2.14.0/numpy==2.5.3."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # numpy<2: unbabel-comet's own torchmetrics/pytorch-lightning pin require it.
    "numpy==1.26.4",
    # setuptools<81: torchmetrics==0.10.3 (pulled in transitively) imports the legacy
    # pkg_resources API, which setuptools>=81 no longer ships.
    "setuptools==80.10.2",
    "unbabel-comet==2.2.7",
    # Same torch version as before, from the CUDA index: COMET-22 (XLM-R large) on CPU ran at
    # ~1 s/sentence, too slow for ~4.4k sentences x 3 ablation checkpoints. On a machine
    # without CUDA this wheel still runs on CPU.
    "torch==2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
