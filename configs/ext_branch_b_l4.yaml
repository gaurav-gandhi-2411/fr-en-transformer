# Extension step (iii) (PREREG 2026-10-02 post-selection amendment, rule 4), Branch B: linear decay
# from the ext_stable_l4 step-40,000 stable checkpoint to 50,000 (10,000 steps, to LR 0 exactly like
# main's WSD decay: tests/test_train_extension.py compares it with wsd_lr_scale(planned=50000, 0.2)).
# Started with `--init-from <Drive>/runs/ext_stable_l4/ckpt/step_00040000.pt`; a NEW run directory,
# the stable run's checkpoints are only read. All other hyperparameters as ext_stable_l4.yaml.
name: ext_branch_b_l4
group: extend_l4
seed: 1234
device: auto
precision: bf16
label_smoothing: 0.1

model:
  vocab_size: 16000
  d_model: 512
  n_heads: 8
  enc_layers: 8
  dec_layers: 4
  d_ff: 2048
  dropout: 0.1
  pos: rope
  max_len: 512
  rope_base: 10000

data:
  shard_dir: data/shards
  train_split: train
  eval_split: e1

batch:
  max_tokens: 4096
  tokens_per_step: 25000
  concat_prob: 0.15
  concat_max_len: 256
  chunk_size: 512
  num_workers: 0

optim:
  lr: 7.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 4000
  planned_steps: 50000  # the step this branch stops at (= decay_end)
  cooldown_frac: 0.2  # unused: decay_start/decay_end below are explicit
  decay_start: 40000
  decay_end: 50000
  max_minutes: null

ckpt:
  dir: runs/ext_branch_b_l4/ckpt
  ckpt_minutes: 10
  ckpt_steps: null
  keep_last: 2
  keep_decay_phase: false  # PREREG rule 5 uses the branch's final checkpoint only (disk-limited Drive)
  milestone_steps: [50000]

logging:
  wandb_mode: offline
  wandb_project: fr-en-transformer
  wandb_entity: gauravgandhi429-gaurav-gandhi
  log_every: 50
  run_dir: runs/ext_branch_b_l4

eval:
  eval_every: 500
  overfit_watch: true
