name: pilot
group: pilot
seed: 1234
device: auto
label_smoothing: 0.1

# Main architecture (spec §5): 8 enc / 4 dec, d=512, 8 heads, FFN 2048, vocab 16000.
# ~50.2M params (measured: 50,229,248).
model:
  vocab_size: 16000
  d_model: 512
  n_heads: 8
  enc_layers: 8
  dec_layers: 4
  d_ff: 2048
  dropout: 0.1
  pos: rope
  max_len: 512
  rope_base: 10000

data:
  shard_dir: data/shards
  train_split: train
  eval_split: e1

batch:
  max_tokens: 4096  # micro-batch token budget; the pilot's job is to re-measure this on a T4
  tokens_per_step: 25000
  concat_prob: 0.0  # pilot measures throughput only, not quality — no augmentation needed
  chunk_size: 512
  num_workers: 0

optim:
  lr: 7.0e-4
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 4000
  planned_steps: 100000  # TBD from pilot — placeholder; the pilot's own run is wall-clock bounded
  cooldown_frac: 0.2
  max_minutes: 15  # spec §1: pilot budget

ckpt:
  dir: runs/pilot/ckpt
  ckpt_minutes: 15
  ckpt_steps: null
  keep_last: 5
  keep_decay_phase: true

logging:
  wandb_mode: offline
  wandb_project: fr-en-transformer
  log_every: 50
  run_dir: runs/pilot

eval:
  eval_every: 100000  # pilot doesn't run long enough to reach an eval interval; effectively off
